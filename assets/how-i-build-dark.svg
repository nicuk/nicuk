<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 0 896 236" width="896" height="236" role="img" aria-labelledby="t d">
<title id="t">How I build</title>
<desc id="d">Rules and checks feed evidence to an AI layer, which abstains if unsure; only what passes verification reaches production, and every production failure becomes a new rule.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.t{font-size:15px;font-weight:600}.s{font-size:12px}.l{font-size:11px}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"/></marker></defs>
<rect x="-4" y="30" width="178" height="94" rx="12" fill="#00d9ff2e" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.0250;0.1350;0.1600;1"/></rect>
<rect x="0" y="34" width="170" height="86" rx="9" fill="#161b22" stroke="#3d444d" stroke-width="1.5"><animate attributeName="stroke" dur="10s" repeatCount="indefinite" values="#3d444d;#00d9ff;#00d9ff;#3d444d;#3d444d" keyTimes="0;0.0250;0.1350;0.1600;1"/></rect>
<text class="t" x="85.0" y="64" text-anchor="middle" fill="#f0f6fc">Rules and checks</text>
<text class="s" x="85.0" y="86" text-anchor="middle" fill="#9198a1">permissions, thresholds,</text>
<text class="s" x="85.0" y="102" text-anchor="middle" fill="#9198a1">schemas, scanners</text>
<rect x="232" y="30" width="178" height="94" rx="12" fill="#00d9ff2e" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2000;0.2250;0.3350;0.3600;1"/></rect>
<rect x="236" y="34" width="170" height="86" rx="9" fill="#161b22" stroke="#3d444d" stroke-width="1.5"><animate attributeName="stroke" dur="10s" repeatCount="indefinite" values="#3d444d;#3d444d;#00d9ff;#00d9ff;#3d444d;#3d444d" keyTimes="0;0.2000;0.2250;0.3350;0.3600;1"/></rect>
<text class="t" x="321.0" y="64" text-anchor="middle" fill="#f0f6fc">AI layer</text>
<text class="s" x="321.0" y="86" text-anchor="middle" fill="#9198a1">reasoning, synthesis,</text>
<text class="s" x="321.0" y="102" text-anchor="middle" fill="#9198a1">language</text>
<rect x="468" y="30" width="178" height="94" rx="12" fill="#00d9ff2e" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4000;0.4250;0.5350;0.5600;1"/></rect>
<rect x="472" y="34" width="170" height="86" rx="9" fill="#161b22" stroke="#3d444d" stroke-width="1.5"><animate attributeName="stroke" dur="10s" repeatCount="indefinite" values="#3d444d;#3d444d;#00d9ff;#00d9ff;#3d444d;#3d444d" keyTimes="0;0.4000;0.4250;0.5350;0.5600;1"/></rect>
<text class="t" x="557.0" y="64" text-anchor="middle" fill="#f0f6fc">Verification</text>
<text class="s" x="557.0" y="86" text-anchor="middle" fill="#9198a1">benchmarks and</text>
<text class="s" x="557.0" y="102" text-anchor="middle" fill="#9198a1">self-tests</text>
<rect x="704" y="30" width="178" height="94" rx="12" fill="#00d9ff2e" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6000;0.6250;0.7350;0.7600;1"/></rect>
<rect x="708" y="34" width="170" height="86" rx="9" fill="#161b22" stroke="#3d444d" stroke-width="1.5"><animate attributeName="stroke" dur="10s" repeatCount="indefinite" values="#3d444d;#3d444d;#00d9ff;#00d9ff;#3d444d;#3d444d" keyTimes="0;0.6000;0.6250;0.7350;0.7600;1"/></rect>
<text class="t" x="793.0" y="64" text-anchor="middle" fill="#f0f6fc">Production</text>
<text class="s" x="793.0" y="86" text-anchor="middle" fill="#9198a1">isolation, failover,</text>
<text class="s" x="793.0" y="102" text-anchor="middle" fill="#9198a1">cost and security</text>
<line x1="174" y1="77.0" x2="232" y2="77.0" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
<text class="l" x="203.0" y="67.0" text-anchor="middle" fill="#9198a1">evidence</text>
<circle r="4.5" fill="#00d9ff" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1000;0.2100;1" path="M174 77.0 L226 77.0"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1000;0.1100;0.2000;0.2100;1"/></circle>
<line x1="410" y1="77.0" x2="468" y2="77.0" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
<text class="l" x="439.0" y="54.0" text-anchor="middle" fill="#9198a1">abstains</text>
<text class="l" x="439.0" y="67.0" text-anchor="middle" fill="#9198a1">if unsure</text>
<circle r="4.5" fill="#00d9ff" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3000;0.4100;1" path="M410 77.0 L462 77.0"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3000;0.3100;0.4000;0.4100;1"/></circle>
<line x1="646" y1="77.0" x2="704" y2="77.0" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
<text class="l" x="675.0" y="54.0" text-anchor="middle" fill="#9198a1">only what</text>
<text class="l" x="675.0" y="67.0" text-anchor="middle" fill="#9198a1">passes</text>
<circle r="4.5" fill="#00d9ff" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5000;0.6100;1" path="M646 77.0 L698 77.0"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5100;0.6000;0.6100;1"/></circle>
<path d="M793.0 124 C793.0 198, 85.0 198, 85.0 130" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#a)"/>
<text class="l" x="439.0" y="198" text-anchor="middle" fill="#9198a1">every production failure becomes a new rule</text>
<circle r="4.5" fill="#00d9ff" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7000;0.9200;1" path="M793.0 124 C793.0 198, 85.0 198, 85.0 130"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7000;0.7100;0.9100;0.9200;1"/></circle>
</svg>