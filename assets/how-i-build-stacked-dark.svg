<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 534" width="360" height="534" role="img" aria-labelledby="t d">
<title id="t">How I build</title>
<desc id="d">Rules and checks feed evidence to an AI layer, which abstains if unsure; only what passes verification reaches production, and every production failure becomes a new rule.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.t{font-size:15px;font-weight:600}.s{font-size:12px}.l{font-size:11px}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"/></marker></defs>
<rect x="36" y="12" width="304" height="80" rx="12" fill="#00d9ff2e" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.0250;0.1350;0.1600;1"/></rect>
<rect x="40" y="16" width="296" height="72" rx="9" fill="#161b22" stroke="#3d444d" stroke-width="1.5"><animate attributeName="stroke" dur="10s" repeatCount="indefinite" values="#3d444d;#00d9ff;#00d9ff;#3d444d;#3d444d" keyTimes="0;0.0250;0.1350;0.1600;1"/></rect>
<text class="t" x="188.0" y="46" text-anchor="middle" fill="#f0f6fc">Rules and checks</text>
<text class="s" x="188.0" y="68" text-anchor="middle" fill="#9198a1">permissions, thresholds, schemas, scanners</text>
<rect x="36" y="142" width="304" height="80" rx="12" fill="#00d9ff2e" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2000;0.2250;0.3350;0.3600;1"/></rect>
<rect x="40" y="146" width="296" height="72" rx="9" fill="#161b22" stroke="#3d444d" stroke-width="1.5"><animate attributeName="stroke" dur="10s" repeatCount="indefinite" values="#3d444d;#3d444d;#00d9ff;#00d9ff;#3d444d;#3d444d" keyTimes="0;0.2000;0.2250;0.3350;0.3600;1"/></rect>
<text class="t" x="188.0" y="176" text-anchor="middle" fill="#f0f6fc">AI layer</text>
<text class="s" x="188.0" y="198" text-anchor="middle" fill="#9198a1">reasoning, synthesis, language</text>
<rect x="36" y="272" width="304" height="80" rx="12" fill="#00d9ff2e" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4000;0.4250;0.5350;0.5600;1"/></rect>
<rect x="40" y="276" width="296" height="72" rx="9" fill="#161b22" stroke="#3d444d" stroke-width="1.5"><animate attributeName="stroke" dur="10s" repeatCount="indefinite" values="#3d444d;#3d444d;#00d9ff;#00d9ff;#3d444d;#3d444d" keyTimes="0;0.4000;0.4250;0.5350;0.5600;1"/></rect>
<text class="t" x="188.0" y="306" text-anchor="middle" fill="#f0f6fc">Verification</text>
<text class="s" x="188.0" y="328" text-anchor="middle" fill="#9198a1">benchmarks and self-tests</text>
<rect x="36" y="402" width="304" height="80" rx="12" fill="#00d9ff2e" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6000;0.6250;0.7350;0.7600;1"/></rect>
<rect x="40" y="406" width="296" height="72" rx="9" fill="#161b22" stroke="#3d444d" stroke-width="1.5"><animate attributeName="stroke" dur="10s" repeatCount="indefinite" values="#3d444d;#3d444d;#00d9ff;#00d9ff;#3d444d;#3d444d" keyTimes="0;0.6000;0.6250;0.7350;0.7600;1"/></rect>
<text class="t" x="188.0" y="436" text-anchor="middle" fill="#f0f6fc">Production</text>
<text class="s" x="188.0" y="458" text-anchor="middle" fill="#9198a1">isolation, failover, cost and security</text>
<line x1="188.0" y1="92" x2="188.0" y2="142" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
<text class="l" x="200.0" y="121.0" fill="#9198a1">evidence</text>
<circle r="4.5" fill="#00d9ff" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1000;0.2100;1" path="M188.0 92 L188.0 136"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1000;0.1100;0.2000;0.2100;1"/></circle>
<line x1="188.0" y1="222" x2="188.0" y2="272" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
<text class="l" x="200.0" y="251.0" fill="#9198a1">abstains if unsure</text>
<circle r="4.5" fill="#00d9ff" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3000;0.4100;1" path="M188.0 222 L188.0 266"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3000;0.3100;0.4000;0.4100;1"/></circle>
<line x1="188.0" y1="352" x2="188.0" y2="402" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
<text class="l" x="200.0" y="381.0" fill="#9198a1">only what passes</text>
<circle r="4.5" fill="#00d9ff" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5000;0.6100;1" path="M188.0 352 L188.0 396"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5100;0.6000;0.6100;1"/></circle>
<path d="M188.0 482 L188.0 500 L16 500 L16 52.0 L36 52.0" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="5 5" stroke-linejoin="round" marker-end="url(#a)"/>
<text class="l" x="188.0" y="522" text-anchor="middle" fill="#9198a1">every production failure becomes a new rule</text>
<circle r="4.5" fill="#00d9ff" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7000;0.9200;1" path="M188.0 482 L188.0 500 L16 500 L16 52.0 L36 52.0"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7000;0.7100;0.9100;0.9200;1"/></circle>
</svg>